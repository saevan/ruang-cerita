# Render Blueprint: deploys the Ruang Cerita Node server on Render's free plan.
services:
  - type: web
    name: ruang-cerita
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # Optional. Leave empty to run the AI in demo mode (no tokens).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
